<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - tsl - dice lab</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - tsl - dice lab">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_tsl_dice_lab.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_tsl_dice_lab.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Procedural Dice Lab</span>
			</div>

			<small>
				One die, a hundred procedural TSL materials and fifty finishes — mix a suit, material and finish, or browse the sheets.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { Fn, atan, attribute, cameraPosition, color, cos, dFdx, dFdy, emissive, faceDirection, float, floor, fract, hue, max, min, mix, mrt, mx_cell_noise_float, mx_fractal_noise_float, mx_noise_float, mx_worley_noise_float, normalLocal, normalView, normalWorld, output, pass, pmremTexture, positionLocal, positionView, positionWorld, reflector, refract, screenUV, sin, smoothstep, step, time, vec2, vec3, vec4 } from 'three/tsl';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
			import { FontLoader } from 'three/addons/loaders/FontLoader.js';
			import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
			import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
			import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
			import { bloom } from 'three/addons/tsl/display/BloomNode.js';

			// die shape

			const BEVEL = 0.07;
			const DISH_RADIUS = 0.1;
			const DISH_DEPTH = 0.05;
			const GEM_RADIUS = 0.11;
			const GEM_FLUSH = 0.002;
			const PIP_OFFSET = 0.225;

			// standard western die - opposite faces sum to seven

			const FACES = [
				{ value: 6, n: [ 1, 0, 0 ], t: [ 0, 0, - 1 ], b: [ 0, 1, 0 ] },
				{ value: 1, n: [ - 1, 0, 0 ], t: [ 0, 0, 1 ], b: [ 0, 1, 0 ] },
				{ value: 5, n: [ 0, 1, 0 ], t: [ 1, 0, 0 ], b: [ 0, 0, - 1 ] },
				{ value: 2, n: [ 0, - 1, 0 ], t: [ 1, 0, 0 ], b: [ 0, 0, 1 ] },
				{ value: 3, n: [ 0, 0, 1 ], t: [ 1, 0, 0 ], b: [ 0, 1, 0 ] },
				{ value: 4, n: [ 0, 0, - 1 ], t: [ - 1, 0, 0 ], b: [ 0, 1, 0 ] }
			];

			const PIP_LAYOUTS = {
				1: [[ 0, 0 ]],
				2: [[ - 1, - 1 ], [ 1, 1 ]],
				3: [[ - 1, - 1 ], [ 0, 0 ], [ 1, 1 ]],
				4: [[ - 1, - 1 ], [ - 1, 1 ], [ 1, - 1 ], [ 1, 1 ]],
				5: [[ - 1, - 1 ], [ - 1, 1 ], [ 0, 0 ], [ 1, - 1 ], [ 1, 1 ]],
				6: [[ - 1, - 1 ], [ - 1, 0 ], [ - 1, 1 ], [ 1, - 1 ], [ 1, 0 ], [ 1, 1 ]]
			};

			const SUITS = {
				emerald: { core: 0x0fae5e, deep: 0x03421f, glow: 0x36e392, neon: 0x2bff9e, ior: 1.58 },
				ruby: { core: 0xd91c44, deep: 0x4a0512, glow: 0xff5a6e, neon: 0xff4a5f, ior: 1.77 },
				sapphire: { core: 0x2450d9, deep: 0x081249, glow: 0x4e79ff, neon: 0x3f7dff, ior: 1.77 },
				amethyst: { core: 0x8f46d9, deep: 0x2e0b57, glow: 0xbe7dff, neon: 0xb95cff, ior: 1.55 }
			};

			let camera, scene, renderer, controls, postProcessing, font;

			let envMap;

			const timer = new THREE.Timer();

			const die = {};
			const sheet = { group: null, kind: null, page: 0 };

			const params = {
				suit: 'emerald',
				material: 'Ceramic',
				finish: 'None',
				view: 'single die',
				page: 1,
				rotate: true
			};

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 38, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 2.4, 4.4 );

				scene = new THREE.Scene();
				scene.backgroundNode = mix( color( 0x16171d ), color( 0x050507 ), smoothstep( 0.0, 1.0, screenUV.sub( vec2( 0.5, 0.55 ) ).length().mul( 1.6 ) ) );

				envMap = await new HDRLoader().setPath( 'textures/equirectangular/' ).loadAsync( 'monochrome_studio_02_1k.hdr' );
				envMap.mapping = THREE.EquirectangularReflectionMapping;

				scene.environment = envMap;
				scene.environmentIntensity = 1.1;

				// lights

				const keyLight = new THREE.DirectionalLight( 0xffffff, 1.6 );
				keyLight.position.set( 4.5, 8, 3.5 );
				keyLight.castShadow = true;
				keyLight.shadow.mapSize.set( 2048, 2048 );
				keyLight.shadow.camera.near = 1;
				keyLight.shadow.camera.far = 25;
				keyLight.shadow.camera.top = 6;
				keyLight.shadow.camera.right = 6;
				keyLight.shadow.camera.bottom = - 6;
				keyLight.shadow.camera.left = - 6;
				keyLight.shadow.normalBias = 0.03;
				scene.add( keyLight );

				const rimLight = new THREE.DirectionalLight( 0x8fb7ff, 0.5 );
				rimLight.position.set( - 6, 3, - 5 );
				scene.add( rimLight );

				createSlab();

				// geometry shared by the single die and the browse sheets

				die.bodyGeometry = createDieBodyGeometry( true );
				die.blankGeometry = createDieBodyGeometry( false );
				die.pipsGeometry = createPipsGeometry();
				die.pluggedPipsGeometry = createPipsGeometry( [ 1 ] );
				die.plugGeometry = new THREE.CylinderGeometry( 0.115, 0.115, 0.05, 48 );
				die.plugGeometry.rotateZ( Math.PI / 2 );

				font = await new FontLoader().loadAsync( 'fonts/helvetiker_regular.typeface.json' );

				// the die under inspection

				die.root = new THREE.Group();
				die.root.position.set( 0, 0.5, 0 );
				scene.add( die.root );

				die.body = new THREE.Mesh( die.bodyGeometry, null );
				die.body.castShadow = true;
				die.body.receiveShadow = true;
				die.root.add( die.body );

				die.pips = new THREE.Mesh( die.pipsGeometry, null );
				die.root.add( die.pips );

				die.plug = new THREE.Mesh( die.plugGeometry, createPlugMaterial() );
				die.plug.position.x = - 0.482;
				die.root.add( die.plug );

				applySelection();

				// renderer

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1.1;
				renderer.shadowMap.enabled = true;
				renderer.setAnimationLoop( animate );
				document.body.appendChild( renderer.domElement );

				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.inspector.domElement );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 0.5, 0 );
				controls.enableDamping = true;
				controls.maxPolarAngle = Math.PI * 0.49;
				controls.minDistance = 0.5;
				controls.maxDistance = 30;

				// selective bloom from the emissive channel

				const scenePass = pass( scene, camera );

				const mrtNode = mrt( {
					output: output,
					emissive: vec4( emissive, output.a )
				} );

				mrtNode.setBlendMode( 'emissive', new THREE.BlendMode( THREE.NormalBlending ) );

				scenePass.setMRT( mrtNode );

				const bloomPass = bloom( scenePass.getTextureNode( 'emissive' ), 0.45, 0.25 );

				postProcessing = new THREE.RenderPipeline( renderer );
				postProcessing.outputNode = scenePass.getTextureNode().add( bloomPass );

				// interface

				const gui = renderer.inspector.createParameters( 'Dice Lab' );

				gui.add( params, 'suit', Object.keys( SUITS ) ).onChange( applySelection );
				gui.add( params, 'material', MATERIALS.map( ( m ) => m[ 0 ] ) ).onChange( applySelection );
				gui.add( params, 'finish', [ 'None', ...FINISHES.map( ( f ) => f[ 0 ] ) ] ).onChange( applySelection );
				gui.add( params, 'rotate' );
				gui.add( {
					random: () => {

						params.material = MATERIALS[ Math.floor( Math.random() * MATERIALS.length ) ][ 0 ];
						params.finish = Math.random() < 0.5 ? 'None' : FINISHES[ Math.floor( Math.random() * FINISHES.length ) ][ 0 ];
						applySelection();

					}
				}, 'random' ).name( 'surprise me' );

				const browse = gui.addFolder( 'browse sheets' );
				browse.add( params, 'view', [ 'single die', 'material sheets', 'finish sheets' ] ).onChange( applyView );
				browse.add( params, 'page', 1, 13, 1 ).onChange( applyView );

				const rendering = gui.addFolder( 'rendering' );
				rendering.close();
				rendering.add( scene, 'environmentIntensity', 0, 3, 0.01 );
				rendering.add( renderer, 'toneMappingExposure', 0, 2, 0.01 ).name( 'exposure' );
				rendering.add( bloomPass.strength, 'value', 0, 2, 0.01 ).name( 'bloomStrength' );
				rendering.add( bloomPass.radius, 'value', 0, 1, 0.01 ).name( 'bloomRadius' );

				window.addEventListener( 'resize', onWindowResize );

			}

			//

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				const delta = Math.min( timer.getDelta(), 0.1 );

				if ( params.rotate && params.view === 'single die' ) die.root.rotation.y += delta * 0.3;

				controls.update();

				postProcessing.render();

			}

			// selection ---------------------------------------------------------------

			const bodyCache = new Map();
			const pipCache = new Map();

			function materialFor( def ) {

				const key = def.material + '|' + ( def.finish ?? '' ) + '|' + def.suit;

				if ( bodyCache.has( key ) ) return bodyCache.get( key );

				const material = buildBodyMaterial( def );
				bodyCache.set( key, material );

				return material;

			}

			function pipsFor( def ) {

				const style = def.material === 'Prism' ? 'prism' : def.suit;
				const key = style + '|' + ( def.finish === 'Neon' ? 'neon' : '' );

				if ( pipCache.has( key ) ) return pipCache.get( key );

				const material = buildPipMaterial( style, def.finish === 'Neon' );
				pipCache.set( key, material );

				return material;

			}

			function applySelection() {

				const def = { material: params.material, finish: params.finish === 'None' ? null : params.finish, suit: params.suit };

				die.body.geometry = def.material === 'Lead' ? die.blankGeometry : die.bodyGeometry;
				die.body.material = materialFor( def );

				die.pips.visible = def.material !== 'Lead';
				die.pips.geometry = def.material === 'Loaded' ? die.pluggedPipsGeometry : die.pipsGeometry;
				die.pips.material = pipsFor( def );

				die.plug.visible = def.material === 'Loaded';

			}

			// browse sheets - nine dice per page

			function applyView() {

				if ( sheet.group !== null ) {

					scene.remove( sheet.group );
					sheet.group = null;

				}

				const single = params.view === 'single die';

				die.root.visible = single;

				if ( single ) {

					camera.position.set( 0, 2.4, 4.4 );
					controls.target.set( 0, 0.5, 0 );
					return;

				}

				const list = params.view === 'material sheets' ? MATERIALS : FINISHES;
				const isFinish = list === FINISHES;
				const pages = Math.ceil( list.length / 9 );
				const page = Math.min( params.page, pages ) - 1;

				sheet.group = new THREE.Group();
				scene.add( sheet.group );

				for ( let i = 0; i < 9; i ++ ) {

					const entry = list[ page * 9 + i ];
					if ( entry === undefined ) break;

					const name = entry[ 0 ];
					const def = isFinish
						? { material: params.material, finish: name, suit: params.suit }
						: { material: name, finish: null, suit: params.suit };

					const root = new THREE.Group();
					root.position.set( ( ( i % 3 ) - 1 ) * 1.6, 0.5, ( Math.floor( i / 3 ) - 1 ) * 1.8 - 0.2 );
					sheet.group.add( root );

					const body = new THREE.Mesh( def.material === 'Lead' ? die.blankGeometry : die.bodyGeometry, materialFor( def ) );
					body.castShadow = true;
					body.receiveShadow = true;
					root.add( body );

					if ( def.material !== 'Lead' ) {

						const pips = new THREE.Mesh( def.material === 'Loaded' ? die.pluggedPipsGeometry : die.pipsGeometry, pipsFor( def ) );
						root.add( pips );

					}

					if ( def.material === 'Loaded' ) {

						const plug = new THREE.Mesh( die.plugGeometry, createPlugMaterial() );
						plug.position.x = - 0.482;
						root.add( plug );

					}

					const labelGeometry = new TextGeometry( name, { font, size: 0.11, depth: 0.01, curveSegments: 5 } );
					labelGeometry.computeBoundingBox();
					labelGeometry.translate( - 0.5 * ( labelGeometry.boundingBox.max.x + labelGeometry.boundingBox.min.x ), 0, 0 );
					labelGeometry.rotateX( - Math.PI / 2 + 0.95 );

					const labelMaterial = new THREE.MeshStandardNodeMaterial( { color: 0x83848c, roughness: 0.6 } );
					labelMaterial.emissiveNode = color( 0x3a3b42 );

					const label = new THREE.Mesh( labelGeometry, labelMaterial );
					label.position.set( root.position.x, 0.004, root.position.z + 0.72 );
					sheet.group.add( label );

				}

				camera.position.set( 0, 7.6, 7 );
				controls.target.set( 0, 0, 0.2 );

			}

			// geometry ---------------------------------------------------------------

			function gridLine( bevelSegments, faceSegments ) {

				const line = [];

				for ( let i = 0; i <= bevelSegments; i ++ ) line.push( ( i / bevelSegments ) * BEVEL );
				for ( let i = 1; i <= faceSegments; i ++ ) line.push( BEVEL + ( i / faceSegments ) * ( 1 - 2 * BEVEL ) );
				for ( let i = 1; i <= bevelSegments; i ++ ) line.push( 1 - BEVEL + ( i / bevelSegments ) * BEVEL );

				return line;

			}

			function dishProfile( t ) {

				const x = Math.min( 1, ( 1 - t ) / 0.45 );
				return x * x * ( 3 - 2 * x );

			}

			function createDieBodyGeometry( withPips ) {

				const line = gridLine( 12, 64 );
				const count = line.length;
				const inner = 0.5 - BEVEL;

				const positions = [];
				const normals = [];
				const pipAos = [];
				const indices = [];

				for ( const face of FACES ) {

					const [ nx, ny, nz ] = face.n;
					const [ tx, ty, tz ] = face.t;
					const [ bx, by, bz ] = face.b;

					const pips = withPips ? PIP_LAYOUTS[ face.value ] : [];
					const offset = positions.length / 3;

					for ( let iy = 0; iy < count; iy ++ ) {

						for ( let ix = 0; ix < count; ix ++ ) {

							const u = line[ ix ] - 0.5;
							const v = line[ iy ] - 0.5;

							let px = nx * 0.5 + tx * u + bx * v;
							let py = ny * 0.5 + ty * u + by * v;
							let pz = nz * 0.5 + tz * u + bz * v;

							const qx = Math.max( - inner, Math.min( inner, px ) );
							const qy = Math.max( - inner, Math.min( inner, py ) );
							const qz = Math.max( - inner, Math.min( inner, pz ) );

							const dl = Math.hypot( px - qx, py - qy, pz - qz );

							let nrx = ( px - qx ) / dl;
							let nry = ( py - qy ) / dl;
							let nrz = ( pz - qz ) / dl;

							px = qx + nrx * BEVEL;
							py = qy + nry * BEVEL;
							pz = qz + nrz * BEVEL;

							let ao = 0;

							for ( const [ cx, cy ] of pips ) {

								const du = u - cx * PIP_OFFSET;
								const dv = v - cy * PIP_OFFSET;
								const r = Math.hypot( du, dv );
								const t = r / DISH_RADIUS;

								if ( t >= 1 ) continue;

								const profile = dishProfile( t );

								px -= nx * DISH_DEPTH * profile;
								py -= ny * DISH_DEPTH * profile;
								pz -= nz * DISH_DEPTH * profile;

								if ( t > 0.55 ) {

									const x = ( 1 - t ) / 0.45;
									const slope = - 6 * x * ( 1 - x ) / ( 0.45 * DISH_RADIUS ) * DISH_DEPTH;
									const hu = slope * du / r;
									const hv = slope * dv / r;

									nrx = nx + tx * hu + bx * hv;
									nry = ny + ty * hu + by * hv;
									nrz = nz + tz * hu + bz * hv;

									const nl = Math.hypot( nrx, nry, nrz );
									nrx /= nl; nry /= nl; nrz /= nl;

								}

								ao = Math.max( ao, profile );

							}

							positions.push( px, py, pz );
							normals.push( nrx, nry, nrz );
							pipAos.push( ao );

						}

					}

					for ( let iy = 0; iy < count - 1; iy ++ ) {

						for ( let ix = 0; ix < count - 1; ix ++ ) {

							const a = offset + iy * count + ix;
							const b = a + 1;
							const c = a + count + 1;
							const d = a + count;

							indices.push( a, b, c, a, c, d );

						}

					}

				}

				const geometry = new THREE.BufferGeometry();
				geometry.setIndex( indices );
				geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( positions, 3 ) );
				geometry.setAttribute( 'normal', new THREE.Float32BufferAttribute( normals, 3 ) );
				geometry.setAttribute( 'pipAo', new THREE.Float32BufferAttribute( pipAos, 1 ) );

				return geometry;

			}

			function createPipsGeometry( excludeValues = [] ) {

				const caps = [];
				let pipIndex = 0;

				for ( const face of FACES ) {

					if ( excludeValues.includes( face.value ) ) continue;

					const [ nx, ny, nz ] = face.n;
					const [ tx, ty, tz ] = face.t;
					const [ bx, by, bz ] = face.b;

					const orientation = new THREE.Quaternion().setFromUnitVectors( new THREE.Vector3( 0, 1, 0 ), new THREE.Vector3( nx, ny, nz ) );

					for ( const [ cx, cy ] of PIP_LAYOUTS[ face.value ] ) {

						const u = cx * PIP_OFFSET;
						const v = cy * PIP_OFFSET;

						const center = new THREE.Vector3(
							nx * ( 0.5 - GEM_FLUSH - GEM_RADIUS ) + tx * u + bx * v,
							ny * ( 0.5 - GEM_FLUSH - GEM_RADIUS ) + ty * u + by * v,
							nz * ( 0.5 - GEM_FLUSH - GEM_RADIUS ) + tz * u + bz * v
						);

						const cap = new THREE.SphereGeometry( GEM_RADIUS, 28, 18, 0, Math.PI * 2, 0, 1.05 );
						cap.applyQuaternion( orientation );
						cap.translate( center.x, center.y, center.z );

						const vertexCount = cap.attributes.position.count;
						const centers = new Float32Array( vertexCount * 3 );
						const seeds = new Float32Array( vertexCount );
						const seed = ( ( pipIndex ++ ) * 0.618034 ) % 1;

						for ( let i = 0; i < vertexCount; i ++ ) {

							centers.set( [ center.x, center.y, center.z ], i * 3 );
							seeds[ i ] = seed;

						}

						cap.setAttribute( 'gemCenter', new THREE.BufferAttribute( centers, 3 ) );
						cap.setAttribute( 'gemSeed', new THREE.BufferAttribute( seeds, 1 ) );

						caps.push( cap );

					}

				}

				return mergeGeometries( caps );

			}

			// tsl helpers ------------------------------------------------------------

			function fbm( position, octaves = 3 ) {

				return mx_fractal_noise_float( position, octaves, 2, 0.5 );

			}

			// 1 on the rounded edges and corners, 0 on the flat faces

			function bevelMask() {

				const e = positionLocal.abs().sub( 0.5 - BEVEL ).div( BEVEL ).clamp();
				return e.x.mul( e.y ).add( e.y.mul( e.z ) ).add( e.z.mul( e.x ) ).clamp();

			}

			// distance to the face border, in the plane of whichever face the point is on

			function faceEdgeDist( p ) {

				const e = vec3( 0.5 ).sub( p.abs() );
				return min( min( max( e.x, e.y ), max( e.y, e.z ) ), max( e.z, e.x ) );

			}

			function fresnel( power ) {

				const facing = normalWorld.dot( cameraPosition.sub( positionWorld ).normalize() ).clamp();
				return facing.oneMinus().pow( power );

			}

			// irregular, view-shifting sparkle - the product of two decorrelated noises
			// keeps the glints jagged instead of reading as round decals

			function glints( p, frequency, gain ) {

				const a = mx_noise_float( p.mul( frequency ) );
				const b = mx_noise_float( p.mul( frequency * 1.61 ).add( 47.3 ) );

				return a.max( 0 ).mul( b.max( 0 ) ).pow( 3 ).mul( gain );

			}

			// thin bright branching lines

			function veins( p, scale, sharpness, seed = 0 ) {

				return fbm( p.mul( scale ).add( seed ) ).abs().oneMinus().clamp().pow( sharpness );

			}

			// warped parallel banding in [ 0, 1 ]

			function bands( p, direction, frequency, warp = 2, seed = 0 ) {

				return sin( p.dot( direction ).mul( frequency ).add( fbm( p.mul( 3 ).add( seed ) ).mul( warp ) ) ).mul( 0.5 ).add( 0.5 );

			}

			// constant random value per lattice cell

			function cells( p, scale, seed = 0 ) {

				return mx_cell_noise_float( p.mul( scale ).add( seed ) );

			}

			// mask that creeps outward from a point with a noisy frontier

			function creep( p, from, radius, fuzz = 0.35, seed = 0 ) {

				const d = p.sub( from ).length().add( fbm( p.mul( 5 ).add( seed ), 2 ).mul( fuzz ) );
				return smoothstep( radius - 0.3, radius, d ).oneMinus();

			}

			// gathers on the top of the die and spills a little over the edges

			function topCoat( p, level = 0.32, fuzz = 0.14, seed = 0 ) {

				return smoothstep( level, level + 0.1, p.y.add( fbm( vec3( p.x, 0, p.z ).mul( 6 ).add( seed ), 2 ).mul( fuzz ) ) );

			}

			// lattice lines projected on the faces, ignoring the face-normal axis

			function latticeLines( p, frequency, width ) {

				const f = fract( p.mul( frequency ) );
				const d = min( f, f.oneMinus() );
				const w = normalLocal.abs().oneMinus();

				const lx = smoothstep( width, width * 0.5, d.x ).mul( w.x );
				const ly = smoothstep( width, width * 0.5, d.y ).mul( w.y );
				const lz = smoothstep( width, width * 0.5, d.z ).mul( w.z );

				return max( lx, max( ly, lz ) ).clamp();

			}

			// perturbs the normal from a procedural height field

			function proceduralBump( heightAt, scale ) {

				return Fn( () => {

					const height = heightAt( positionLocal );
					const dHdx = heightAt( positionLocal.add( dFdx( positionLocal ).clamp( - 0.01, 0.01 ) ) ).sub( height );
					const dHdy = heightAt( positionLocal.add( dFdy( positionLocal ).clamp( - 0.01, 0.01 ) ) ).sub( height );

					const sigmaX = dFdx( positionView );
					const sigmaY = dFdy( positionView );

					const r1 = sigmaY.cross( normalView );
					const r2 = normalView.cross( sigmaX );

					const det = sigmaX.dot( r1 ).mul( faceDirection );
					const gradient = det.sign().mul( dHdx.mul( r1 ).add( dHdy.mul( r2 ) ) ).mul( scale );

					return det.abs().mul( normalView ).sub( gradient ).normalize();

				} )();

			}

			function spectrum( t ) {

				return cos( vec3( t ).add( vec3( 0, 0.33, 0.67 ) ).mul( Math.PI * 2 ) ).mul( 0.5 ).add( 0.5 );

				return positionWorld.sub( cameraPosition ).normalize();

			// shared recipe for the elemental auras

			function elementalAura( surf, tintA, tintB, drift, seed ) {

				const p = positionLocal;

				const field = fbm( p.mul( 3 ).add( drift ).add( seed ) );
				const wisps = field.abs().oneMinus().clamp().pow( 4 );
				const body = smoothstep( 0.2, 0.9, field.mul( 0.5 ).add( 0.5 ) );

				const auraColor = mix( color( tintA ), color( tintB ), body );

				addEmissive( surf, auraColor.mul( wisps.mul( 0.8 ).add( body.mul( 0.2 ) ) ).mul( fresnel( 1.6 ).mul( 0.8 ).add( 0.3 ) ).mul( 1.1 ) );

				const powder = smoothstep( 0.4, 0.8, mx_noise_float( p.mul( 55 ).add( 8.8 ) ).mul( 0.5 ).add( 0.5 ) );

				surf.color = mix( surf.color, color( dustColor ), powder.mul( 0.22 ) );
				surf.roughness = surf.roughness.add( powder.mul( 0.15 ) );
				addEmissive( surf, color( dustColor ).mul( dust ).mul( 1.3 ).add( color( dustColor ).mul( powder ).mul( 0.06 ) ) );

			// shared recipe for the wood species

			function woodSurf( surf, options ) {

				const { light, dark, ringFrequency, warp, rough, gloss, seed } = options;
				const p = positionLocal;

				const rings = ( q ) => sin( q.yz.length().mul( ringFrequency ).add( fbm( q.mul( 3 ).add( seed ) ).mul( warp ) ).add( q.x.mul( 1.5 ) ) );
				const latewood = smoothstep( - 0.2, 0.85, rings( p ) );
				const streaks = mx_noise_float( vec3( p.x.mul( 8 ), p.y.mul( 150 ), p.z.mul( 150 ) ).add( seed ) ).mul( 0.5 ).add( 0.5 );

				surf.color = mix( color( light ), color( dark ), latewood.mul( 0.75 ).add( streaks.mul( 0.25 ) ) );
				surf.roughness = float( rough ).add( latewood.mul( 0.12 ) );
				surf.clearcoat = float( gloss );
				surf.clearcoatRoughness = float( 0.25 );
				surf.height.push( ( q ) => sin( q.yz.length().mul( ringFrequency ).add( fbm( q.mul( 3 ).add( seed ) ).mul( warp ) ).add( q.x.mul( 1.5 ) ) ).mul( 0.5 ).add( mx_noise_float( vec3( q.x.mul( 8 ), q.y.mul( 150 ), q.z.mul( 150 ) ).add( seed ) ).mul( 0.4 ) ) );

					const echo = smoothstep( 0.1, 0.04, fbm( p.mul( 1.7 ).add( 21.5 ) ).abs().sub( 0.34 ).abs() );

					surf.color = mix( surf.color, color( 0x15100c ), bold.add( echo.mul( 0.85 ) ).clamp() );
					surf.roughness = mix( surf.roughness, float( 0.55 ), bold );

				} ],

				[ 'Mummy Wrap', ( surf ) => {

					const p = positionLocal;

					const wrapA = fract( p.dot( vec3( 0.9, 2.4, 0.5 ) ).add( fbm( p.mul( 3 ) ).mul( 0.15 ) ) );
					const wrapB = fract( p.dot( vec3( - 0.6, 2.4, 0.9 ) ).add( 0.4 ).add( fbm( p.mul( 3.3 ) ).mul( 0.15 ) ) );
					const bandA = smoothstep( 0.06, 0.14, wrapA ).mul( smoothstep( 0.92, 0.82, wrapA ) );
					const bandB = smoothstep( 0.06, 0.14, wrapB ).mul( smoothstep( 0.92, 0.82, wrapB ) );
					const linen = max( bandA, bandB );
					const weaveTexture = mx_noise_float( vec3( p.x.mul( 150 ), p.y.mul( 30 ), p.z.mul( 150 ) ) ).mul( 0.5 ).add( 0.5 );

					surf.color = mix( surf.color, mix( color( 0xb5a37e ), color( 0xd4c49e ), weaveTexture ), linen.mul( 0.96 ) );
					surf.roughness = mix( surf.roughness, float( 0.85 ), linen );
					surf.metalness = surf.metalness.mul( linen.oneMinus() );
					surf.height.push( ( q ) => {

						const qa = fract( q.dot( vec3( 0.9, 2.4, 0.5 ) ).add( fbm( q.mul( 3 ) ).mul( 0.15 ) ) );
						const qb = fract( q.dot( vec3( - 0.6, 2.4, 0.9 ) ).add( 0.4 ).add( fbm( q.mul( 3.3 ) ).mul( 0.15 ) ) );
						return max( smoothstep( 0.06, 0.14, qa ).mul( smoothstep( 0.92, 0.82, qa ) ), smoothstep( 0.06, 0.14, qb ).mul( smoothstep( 0.92, 0.82, qb ) ) ).mul( 2.2 );

					} );
					surf.bumpScale = Math.max( surf.bumpScale, 0.0025 );

				} ],

				[ 'Prism Edge', ( surf ) => {

					const p = positionLocal;
					const bevel = bevelMask();

					const split = spectrum( p.x.add( p.y ).add( p.z ).mul( 1.4 ).add( fresnel( 1.5 ).mul( 1.2 ) ) );
					const twinkle = glints( p, 90, 10 ).clamp().mul( 0.6 ).add( 0.4 );

					addEmissive( surf, split.mul( bevel.pow( 1.3 ) ).mul( twinkle ).mul( 1.5 ) );

				} ],

				[ 'Eclipse', ( surf ) => {

					const p = positionLocal;

					const orbit = vec3( sin( time.mul( 0.4 ) ).mul( 0.5 ), sin( time.mul( 0.31 ) ).mul( 0.35 ), cos( time.mul( 0.4 ) ).mul( 0.5 ) );
					const d = p.sub( orbit ).length();
					const shadow = smoothstep( 0.36, 0.18, d );
					const corona = smoothstep( 0.05, 0.015, d.sub( 0.36 ).abs() );

					surf.color = surf.color.mul( shadow.mul( 0.85 ).oneMinus() );
					addEmissive( surf, color( 0xffb45a ).mul( corona ).mul( 0.9 ) );

				} ],

				[ 'Voltage', ( surf ) => {

					const p = positionLocal;

					const frame = floor( time.mul( 8 ) );
					const arcs = veins( floor( p.mul( 24 ) ).div( 24 ).add( frame.mul( 0.317 ) ), 3.1, 14 );
					const region = step( 0.6, mx_cell_noise_float( floor( p.mul( 2.2 ) ).add( frame.mul( 1.7 ) ) ) );
					const live = step( 0.3, mx_cell_noise_float( vec3( frame, 3.3, 7.1 ) ) );

					addEmissive( surf, color( 0x9fd4ff ).mul( arcs ).mul( region ).mul( live ).mul( 3 ).add( color( 0x3f7dff ).mul( fresnel( 2.6 ) ).mul( 0.2 ) ) );

				} ],

				[ 'Enchanted', ( surf ) => {

					const p = positionLocal;

					const sweep = sin( p.dot( vec3( 1.2, 2.4, 0.8 ) ).mul( 2.4 ).sub( time.mul( 1.3 ) ) ).mul( 0.5 ).add( 0.5 ).pow( 2.5 );
					const risingMotes = glints( p.sub( vec3( 0, time.mul( 0.18 ), 0 ) ), 85, 9 ).clamp();

					addEmissive( surf, mix( color( 0xb44fff ), color( 0xf2e2ff ), sweep ).mul( sweep ).mul( 0.65 ).add( color( 0xd8a8ff ).mul( risingMotes ) ) );
					surf.clearcoat = float( 1 );
					surf.clearcoatRoughness = float( 0.05 );

				} ],

				[ 'Toxic', ( surf ) => {

					const p = positionLocal;
					const sides = normalLocal.y.abs().oneMinus();

					const columns = mx_cell_noise_float( vec3( floor( p.x.mul( 11 ) ), 2, floor( p.z.mul( 11 ) ) ) );
					const ooze = smoothstep( 0, 0.15, p.y.sub( float( 0.5 ).sub( columns.mul( 0.8 ).add( 0.05 ) ) ) ).mul( sides ).add( topCoat( p, 0.38, 0.06, 8.1 ) ).clamp();
					const pulse = sin( time.mul( 1.5 ).add( p.y.mul( 5 ) ) ).mul( 0.25 ).add( 0.75 );

					surf.color = mix( surf.color, color( 0x2a4a10 ), ooze.mul( 0.9 ) );
					surf.roughness = mix( surf.roughness, float( 0.08 ), ooze );
					addEmissive( surf, color( 0x54e81e ).mul( ooze ).mul( pulse ).mul( 0.85 ) );
					surf.height.push( ( q ) => {

						const col = mx_cell_noise_float( vec3( floor( q.x.mul( 11 ) ), 2, floor( q.z.mul( 11 ) ) ) );
						return smoothstep( 0, 0.15, q.y.sub( float( 0.5 ).sub( col.mul( 0.8 ).add( 0.05 ) ) ) ).mul( 2.2 );

					} );
					surf.bumpScale = Math.max( surf.bumpScale, 0.0026 );

				} ],

				[ 'Honey Glaze', ( surf ) => {

					const p = positionLocal;
					const sides = normalLocal.y.abs().oneMinus();

					const wobble = mx_noise_float( p.mul( 22 ) ).mul( 0.08 );
					const columns = mx_cell_noise_float( vec3( floor( p.x.mul( 16 ) ), 3, floor( p.z.mul( 16 ) ) ) ).mul( 0.5 ).add( fbm( vec3( p.x, 0, p.z ).mul( 4 ).add( 3 ) ).mul( 0.25 ).add( 0.25 ) );
					const drizzle = smoothstep( 0, 0.24, p.y.sub( float( 0.45 ).sub( columns.mul( 0.85 ) ) ).add( wobble ) ).mul( sides ).add( topCoat( p, 0.34, 0.1, 12.7 ) ).clamp();

					surf.color = mix( surf.color, mix( color( 0xb56f10 ), color( 0xe8a83e ), p.y.add( 0.5 ) ), drizzle.mul( 0.9 ) );
					surf.roughness = mix( surf.roughness, float( 0.04 ), drizzle );
					surf.clearcoat = float( 1 );
					surf.clearcoatRoughness = float( 0.03 );
					addEmissive( surf, color( 0xe8a83e ).mul( drizzle ).mul( fresnel( 2 ).mul( 0.6 ).add( 0.25 ) ).mul( 0.45 ) );
					surf.height.push( ( q ) => {

						const col = mx_cell_noise_float( vec3( floor( q.x.mul( 16 ) ), 3, floor( q.z.mul( 16 ) ) ) ).mul( 0.5 ).add( fbm( vec3( q.x, 0, q.z ).mul( 4 ).add( 3 ) ).mul( 0.25 ).add( 0.25 ) );
						return smoothstep( 0, 0.24, q.y.sub( float( 0.45 ).sub( col.mul( 0.85 ) ) ).add( mx_noise_float( q.mul( 22 ) ).mul( 0.08 ) ) ).mul( 1.8 );

					} );
					surf.bumpScale = Math.max( surf.bumpScale, 0.002 );

				} ],

				// elemental auras ------------------------------------------------

				[ 'Flame Aura', ( surf ) => {

					elementalAura( surf, 0xff4a12, 0xffb43e, vec3( 0, time.mul( - 0.85 ), 0 ), 3.1 );

				} ],

				[ 'Tide Aura', ( surf ) => {

					elementalAura( surf, 0x1e6ae8, 0x4fd8e8, vec3( time.mul( 0.55 ), sin( time.mul( 0.6 ) ).mul( 0.3 ), 0 ), 9.4 );

				} ],

				[ 'Gale Aura', ( surf ) => {

					elementalAura( surf, 0xbfe8dc, 0xe8f6f0, vec3( time.mul( 1.4 ), time.mul( 0.3 ), time.mul( 1.1 ) ), 15.8 );

				} ],

				[ 'Terra Aura', ( surf ) => {

					elementalAura( surf, 0x8a5f2a, 0x9ac44e, vec3( 0, time.mul( 0.18 ), 0 ), 22.6 );

				} ],

				[ 'Void Aura', ( surf ) => {

					const p = positionLocal;

					elementalAura( surf, 0x3a1260, 0x8a3fd8, vec3( sin( time.mul( 0.4 ) ).mul( 0.4 ), time.mul( - 0.25 ), cos( time.mul( 0.4 ) ).mul( 0.4 ) ), 31.3 );

					surf.color = surf.color.mul( 0.6 );
					addEmissive( surf, color( 0xc9a1f2 ).mul( glints( p.add( vec3( 0, time.mul( 0.1 ), 0 ) ), 70, 8 ).clamp() ).mul( 0.8 ) );

				} ],

				// gem dust -------------------------------------------------------

				[ 'Emerald Dust', ( surf ) => {

					gemDust( surf, 0x2fd88a );

				} ],

				[ 'Ruby Dust', ( surf ) => {

					gemDust( surf, 0xff4a5f );

				} ],

				[ 'Sapphire Dust', ( surf ) => {

					gemDust( surf, 0x4f7dff );

				} ],

				[ 'Amethyst Dust', ( surf ) => {

					gemDust( surf, 0xbe7dff );

				} ],

				[ 'Diamond Dust', ( surf ) => {

					gemDust( surf, 0xf2f6ff );

				} ]

			];

			const MATERIAL_FNS = Object.fromEntries( MATERIALS );
			const FINISH_FNS = Object.fromEntries( FINISHES );

			function addEmissive( surf, node ) {

				surf.emissive = surf.emissive === null ? node : surf.emissive.add( node );

			}

			// material assembly ------------------------------------------------------

			function buildBodyMaterial( def ) {

				const surf = {
					color: color( 0xffffff ),
					roughness: float( 0.5 ),
					metalness: float( 0 ),
					emissive: null,
					clearcoat: null,
					clearcoatRoughness: null,
					sheen: null,
					sheenRoughness: null,
					height: [],
					bumpScale: 0.001,
					aoStrength: 0.55,
					props: {}
				};

				try {

					MATERIAL_FNS[ def.material ]( surf );
					if ( def.finish !== null ) FINISH_FNS[ def.finish ]( surf, def );

				} catch ( e ) {

					console.error( 'dice lab: "' + def.material + '" + "' + def.finish + '" failed:', e );
					surf.color = color( 0xff00ff );

				}

				const material = new THREE.MeshPhysicalNodeMaterial();

				material.colorNode = surf.color.mul( attribute( 'pipAo' ).mul( surf.aoStrength ).oneMinus() );
				material.roughnessNode = surf.roughness;
				material.metalnessNode = surf.metalness;

				if ( surf.emissive !== null ) material.emissiveNode = surf.emissive;
				if ( surf.clearcoat !== null ) material.clearcoatNode = surf.clearcoat;
				if ( surf.clearcoatRoughness !== null ) material.clearcoatRoughnessNode = surf.clearcoatRoughness;
				if ( surf.sheen !== null ) material.sheenNode = surf.sheen;
				if ( surf.sheenRoughness !== null ) material.sheenRoughnessNode = surf.sheenRoughness;
				if ( surf.height.length > 0 ) material.normalNode = proceduralBump( ( q ) => surf.height.reduce( ( sum, layer ) => sum.add( layer( q ) ), float( 0 ) ), surf.bumpScale );

				Object.assign( material, surf.props );

				return material;

			}

			// gem pips - view rays refract into each stone and sample veils, zoning
			// and twinkling glints along the way

			function buildPipMaterial( style, neonBoost ) {

				const material = new THREE.MeshPhysicalNodeMaterial();

				const seed = attribute( 'gemSeed' );
				const localPos = positionLocal.sub( attribute( 'gemCenter' ) );
				const incident = viewIncident();
				const facing = normalWorld.dot( incident.negate() ).clamp();
				const rim = facing.oneMinus().pow( 3 );
				const noiseOffset = seed.mul( 43.7 );

				if ( style === 'prism' ) {

					const swirl = fbm( localPos.mul( 26 ).add( noiseOffset ), 2 ).mul( 0.35 );
					const oil = spectrum( facing.mul( 1.4 ).add( swirl ).add( seed ) );

					material.colorNode = color( 0x08080a );
					material.metalnessNode = float( 1 );
					material.roughnessNode = float( 0.12 ).add( fbm( localPos.mul( 40 ), 2 ).abs().mul( 0.08 ) );
					material.emissiveNode = oil.mul( rim.mul( 0.9 ).add( 0.25 ) ).mul( 0.9 );
					material.iridescence = 1;
					material.iridescenceIOR = 1.35;
					material.envMapIntensity = 1.4;

					if ( neonBoost ) material.emissiveNode = material.emissiveNode.add( oil.mul( sin( time.mul( 1.7 ) ).mul( 0.15 ).add( 0.85 ) ).mul( 0.8 ) );

				} else {

					const suit = SUITS[ style ];

					const shift = seed.sub( 0.5 ).mul( 0.18 );
					const core = hue( color( suit.core ), shift );
					const deep = hue( color( suit.deep ), shift );
					const glowColor = hue( color( suit.glow ), shift );

					const refracted = refract( incident, normalWorld, 1 / suit.ior );

					const veilNear = fbm( localPos.add( refracted.mul( 0.05 ) ).mul( 34 ).add( noiseOffset ) ).mul( 0.5 ).add( 0.5 );
					const veilFar = fbm( localPos.add( refracted.mul( 0.12 ) ).mul( 21 ).add( noiseOffset ) ).mul( 0.5 ).add( 0.5 );
					const depthMix = veilNear.mul( 0.6 ).add( veilFar.mul( 0.4 ) );

					const zoning = sin( depthMix.mul( 7 ).add( seed.mul( 20 ) ) ).mul( 0.5 ).add( 0.5 );
					const silk = smoothstep( 0.4, 0.8, fbm( localPos.mul( 30 ).add( noiseOffset ), 2 ).mul( 0.5 ).add( 0.5 ) ).mul( 0.35 );
					const sparkle = glints( localPos.add( refracted.mul( 0.08 ) ), 150, 10 ).clamp();

					const interior = mix( deep, core, smoothstep( 0.15, 0.85, depthMix ) ).mul( zoning.mul( 0.3 ).add( 0.8 ) );
					const through = pmremTexture( envMap, refracted, float( 0.22 ) ).mul( core ).mul( facing.mul( 0.7 ).add( 0.3 ) );

					material.colorNode = mix( deep, core, depthMix.mul( 0.5 ) ).mul( 0.45 ).mul( silk.oneMinus() );
					material.emissiveNode = through.mul( 0.32 )
						.add( interior.mul( depthMix ).mul( 0.45 ).mul( facing ) )
						.add( glowColor.mul( rim ).mul( 0.22 ) )
						.mul( silk.mul( 0.7 ).oneMinus() )
						.add( mix( color( 0xffffff ), glowColor, 0.35 ).mul( sparkle ).mul( 0.7 ) );
					material.roughnessNode = float( 0.09 ).add( veilNear.mul( 0.04 ) );
					material.ior = suit.ior;
					material.clearcoat = 1;
					material.clearcoatRoughness = 0.06;
					material.envMapIntensity = 1.0;

					if ( neonBoost ) material.emissiveNode = material.emissiveNode.add( glowColor.mul( sin( time.mul( 1.7 ) ).mul( 0.15 ).add( 0.85 ) ).mul( 0.5 ) );

				}

				return material;

			}

			function createPlugMaterial() {

				const material = new THREE.MeshStandardNodeMaterial();

				const radius = positionLocal.yz.length();
				const rings = sin( radius.mul( 480 ) ).mul( 0.5 ).add( 0.5 );
				const wear = fbm( positionLocal.mul( 30 ).add( 3 ), 2 ).mul( 0.5 ).add( 0.5 );

				material.colorNode = mix( color( 0x84898f ), color( 0xa7adb4 ), wear );
				material.metalnessNode = float( 1 );
				material.roughnessNode = float( 0.32 ).add( rings.mul( 0.2 ) );

				return material;

			}

			// display slab -------------------------------------------------------------

			function createSlab() {

				const reflection = reflector( { resolutionScale: 0.35 } );
				reflection.target.rotateX( - Math.PI / 2 );
				reflection.target.position.y = 0.001;
				scene.add( reflection.target );

				const p = positionWorld;

				reflection.uvNode = reflection.uvNode.add( vec2( mx_noise_float( p.mul( 3.1 ) ), mx_noise_float( p.mul( 3.3 ).add( 11 ) ) ).mul( 0.0015 ) );

				const material = new THREE.MeshPhysicalNodeMaterial();

				const marbleVeins = fbm( vec3( p.x.mul( 0.6 ), p.y.mul( 2 ), p.z.mul( 0.6 ) ).add( 3.7 ), 4 );
				const marbling = marbleVeins.abs().oneMinus().pow( 12 );

				material.colorNode = mix( color( 0x0f0f13 ), color( 0x15151a ), fbm( p.mul( 0.8 ) ).mul( 0.5 ).add( 0.5 ) ).add( color( 0x3a3f4d ).mul( marbling ).mul( 0.18 ) );
				material.roughnessNode = float( 0.24 ).add( marbleVeins.mul( 0.04 ) );
				material.clearcoatNode = float( 1 );
				material.clearcoatRoughnessNode = float( 0.08 );
				material.emissiveNode = reflection.rgb.mul( color( 0x96a3b8 ) ).mul( 0.2 );

				material.mrtNode = mrt( { emissive: vec4( 0, 0, 0, 1 ) } );

				const slab = new THREE.Mesh( new RoundedBoxGeometry( 7, 0.5, 7.6, 4, 0.1 ), material );
				slab.position.y = - 0.25;
				slab.receiveShadow = true;
				scene.add( slab );

			}

		</script>

	</body>
