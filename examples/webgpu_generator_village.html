<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - village generator</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - village generator">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_generator_village.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_generator_village.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Village Generator</span>
			</div>

			<small>
				A procedurally generated Ligurian cliffside village, in the manner of the Cinque Terre.
				Optional screen-space GI, water reflections and temporal AA.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { diffuseColor, materialRoughness, mix, mrt, normalView, normalViewGeometry, output, packNormalToRGB, pass, positionViewDirection, sample, unpackRGBToNormal, vec4, velocity } from 'three/tsl';

			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { SkyMesh } from 'three/addons/objects/SkyMesh.js';
			import { bloom } from 'three/addons/tsl/display/BloomNode.js';
			import { ssgi } from 'three/addons/tsl/display/SSGINode.js';
			import { ssr } from 'three/addons/tsl/display/SSRNode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';
			import { VillageGenerator } from 'three/addons/generators/VillageGenerator.js';
			import { createHouseMaterial } from 'three/addons/generators/village/HouseGenerator.js';

			let camera, scene, renderer, controls, renderPipeline, bloomPass;
			const effectPasses = []; // the live chain, disposed on rebuild
			let villageGroup, materials, village;
			let sky, sunLight, pmremGenerator, envScene;

			// reused by updateSun(): the current sun direction and the key-light
			// colours it blends between as the sun nears the horizon or climbs high
			const sun = new THREE.Vector3();
			const sunHorizonColor = new THREE.Color( 0xffb072 );
			const sunMiddayColor = new THREE.Color( 0xfff4e8 );

			const parameters = {
				seed: 1,
				timeOfDay: 10.5, // hours: 6 sunrise, 12 noon, 18 sunset
				globalIllumination: false, // screen-space GI with its own ambient occlusion
				reflections: false, // screen-space reflections, traced for the sea alone
				temporalAA: false,
				bloom: 0.03
			};

			init();

			async function init() {

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.55;
				renderer.shadowMap.enabled = true;
				renderer.shadowMap.type = THREE.PCFSoftShadowMap;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				pmremGenerator = new THREE.PMREMGenerator( renderer );

				scene = new THREE.Scene();
				scene.environmentIntensity = 0.35; // sky as a soft fill; the sun is the key

				// a physical sky drives both the backdrop and the image-based lighting;
				// low turbidity for the deep Mediterranean blue

				sky = new SkyMesh();
				sky.scale.setScalar( 10000 );
				sky.turbidity.value = 3;
				sky.rayleigh.value = 2.5;
				sky.mieCoefficient.value = 0.004;
				sky.mieDirectionalG.value = 0.9;

				envScene = new THREE.Scene();

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 1, 8000 );
				camera.position.set( 150, 62, 235 );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.target.set( - 30, 22, 15 );
				controls.maxPolarAngle = Math.PI * 0.49;
				controls.minDistance = 40;
				controls.maxDistance = 900;
				controls.update();

				// a single directional key aligned with the sky's sun, for the crisp
				// shadows the IBL alone can't give; sized to hold the whole headland

				sunLight = new THREE.DirectionalLight();
				sunLight.castShadow = true;
				sunLight.shadow.camera.left = - 300;
				sunLight.shadow.camera.right = 300;
				sunLight.shadow.camera.top = 320;
				sunLight.shadow.camera.bottom = - 200;
				sunLight.shadow.camera.far = 2000;
				sunLight.shadow.mapSize.set( 4096, 4096 );
				sunLight.shadow.bias = - 0.0004;
				scene.add( sunLight );

				updateSun();

				materials = { house: createHouseMaterial() };
				village = new VillageGenerator( { seed: parameters.seed } );
				generateVillage();

				renderPipeline = new THREE.RenderPipeline( renderer );
				buildPipeline();

				// parameters

				const gui = renderer.inspector.createParameters( 'Village' );
				gui.add( parameters, 'seed', 0, 100, 1 ).onChange( generateVillage );
				gui.add( parameters, 'timeOfDay', 6, 18, 0.1 ).name( 'time of day' ).onChange( updateSun );
				gui.add( parameters, 'globalIllumination' ).name( 'global illumination' ).onChange( buildPipeline );
				gui.add( parameters, 'reflections' ).name( 'water reflections' ).onChange( buildPipeline );
				gui.add( parameters, 'temporalAA' ).name( 'temporal AA' ).onChange( buildPipeline );
				gui.add( renderer, 'toneMappingExposure', 0.01, 1 ).name( 'exposure' );
				gui.add( parameters, 'bloom', 0, 1 ).onChange( ( value ) => bloomPass.strength.value = value );

				window.addEventListener( 'resize', onWindowResize );

			}

			// composes the render pipeline for the current toggles. the scene pass only
			// carries the extra targets the screen-space effects read ( normals,
			// velocity, material data ), so with everything off the plain view pays for
			// none of it; bloom always caps the chain, on the linear HDR colour.

			function buildPipeline() {

				for ( const effect of effectPasses ) effect.dispose();
				effectPasses.length = 0;

				const screenSpace = parameters.globalIllumination || parameters.reflections || parameters.temporalAA;

				// the temporal history copies need a single-sample pass, so MSAA steps
				// aside while any screen-space effect runs ( temporal AA covers for it )
				const scenePass = pass( scene, camera, screenSpace ? { samples: 0 } : {} );
				effectPasses.push( scenePass );

				if ( screenSpace ) {

					scenePass.setMRT( mrt( {
						output: output,
						diffuseColor: vec4( diffuseColor.rgb, 0 ), // albedo; the alpha is a reflection weight, written by the sea below
						normal: vec4( packNormalToRGB( normalView ).rgb, materialRoughness ), // packed normal, with roughness in alpha
						velocity: velocity
					} ) );

				}

				// only the sea reflects: it tags its pixels through the shared diffuse
				// target with a fresnel weight, so the island leans into the water more
				// strongly the flatter the view — the way water does
				const seaMaterial = village.seaMaterial;

				if ( parameters.reflections ) {

					// friendlier than the physical curve — the camera flies well above the
					// water, and true fresnel would starve the reflection at that height
					const facing = normalView.dot( positionViewDirection ).clamp();
					const fresnel = facing.oneMinus().pow( 3 ).mul( 0.65 ).add( 0.35 );

					// the sea's roughness lives in its roughnessNode — materialRoughness
					// reads the scalar property, which the node leaves at 1
					const seaRoughness = seaMaterial.roughnessNode;
					const gloss = seaRoughness.smoothstep( 0.15, 0.5 ).oneMinus(); // the foam stays matte

					// trace against a mostly flattened normal: the full swell scatters
					// neighbouring rays so far apart that hits arrive one pixel at a
					// time — this keeps the mirror image coherent, and what remains of
					// the wobble still makes the reflection swim
					const tracingNormal = mix( normalViewGeometry, normalView, 0.35 );

					seaMaterial.mrtNode = mrt( {
						diffuseColor: vec4( diffuseColor.rgb, fresnel.mul( gloss ) ),
						// the roughness is compressed for the blur-mip pick: the wobble in
						// the traced normal already softens the image, and the mid mips
						// read as blocky smears on water this bright
						normal: vec4( packNormalToRGB( tracingNormal ).rgb, seaRoughness.mul( 0.3 ) )
					} );

				} else {

					seaMaterial.mrtNode = null;

				}

				seaMaterial.needsUpdate = true;

				const scenePassColor = scenePass.getTextureNode( 'output' );
				let color = scenePassColor;

				if ( screenSpace ) {

					const scenePassDepth = scenePass.getTextureNode( 'depth' );
					const scenePassNormal = scenePass.getTextureNode( 'normal' );
					const scenePassVelocity = scenePass.getTextureNode( 'velocity' );
					const scenePassDiffuse = scenePass.getTextureNode( 'diffuseColor' );

					// the colour-like targets don't need float precision ( bandwidth )

					scenePass.getTexture( 'diffuseColor' ).type = THREE.UnsignedByteType;
					scenePass.getTexture( 'normal' ).type = THREE.UnsignedByteType;

					const sceneNormal = sample( ( uv ) => unpackRGBToNormal( scenePassNormal.sample( uv ).rgb ) );

					if ( parameters.globalIllumination ) {

						// screen-space GI: bounce light gathered from the frame itself —
						// the sunlit pastel walls carry into the alleys — with its own
						// horizon-based ambient occlusion

						const giPass = ssgi( color, scenePassDepth, sceneNormal, camera );
						giPass.sliceCount.value = 2;
						giPass.stepCount.value = 8;
						effectPasses.push( giPass );

						color = vec4( color.rgb.mul( giPass.getAONode() ).add( scenePassDiffuse.rgb.mul( giPass.getGINode().rgb ) ), color.a );

					}

					if ( parameters.reflections ) {

						// a single mirror trace, weighted by the fresnel term the sea wrote
						// into the diffuse alpha; every other surface early-outs at weight
						// zero. no denoiser — the swell in the normals is the only scatter,
						// and it reads as living water. the ray-march samples the raw pass
						// texture ( the GI composite above is an expression, which a
						// marcher can't read at arbitrary points ).
						const ssrPass = ssr( scenePassColor, scenePassDepth, sceneNormal, {
							camera,
							metalnessNode: scenePassDiffuse.a,
							roughnessNode: scenePassNormal.a
						} );
						ssrPass.maxDistance.value = 250; // in metres — the headland stands tall, and its reflection reaches far
						ssrPass.thickness.value = 2;
						ssrPass.quality.value = 0.5;
						effectPasses.push( ssrPass );

						// a fresnel lerp rather than a plain add: the water dims by the
						// weight where the ray hit, so dark cliffs reflect as convincingly
						// as sunlit walls
						const reflectivity = scenePassDiffuse.a.mul( ssrPass.a.greaterThan( 0 ).toFloat() );

						color = vec4( color.rgb.mul( reflectivity.oneMinus() ).add( ssrPass.rgb ), color.a );

					}

					if ( parameters.temporalAA ) {

						color = traa( color, scenePassDepth, scenePassVelocity, camera );
						effectPasses.push( color );

					}

				}

				bloomPass = bloom( color, parameters.bloom, 0.0, 0.0 );
				effectPasses.push( bloomPass );

				renderPipeline.outputNode = color.add( bloomPass );
				renderPipeline.needsUpdate = true;

			}

			function updateSun() {

				// map the time of day to a sun arc: low and warm at dawn / dusk, high
				// and bright at noon, sweeping east → west over the sea

				const t = parameters.timeOfDay;
				const u = ( t - 12 ) / 6; // -1 at sunrise, 0 at noon, +1 at sunset
				const elevation = Math.max( 0, 1 - u * u ) * 68; // degrees above the horizon, peaks at noon
				const azimuth = 135 + u * 80; // east of the cove → west behind the headland

				sun.setFromSphericalCoords( 1, THREE.MathUtils.degToRad( 90 - elevation ), THREE.MathUtils.degToRad( azimuth ) );
				sky.sunPosition.value.copy( sun );

				// physically-motivated key light: real sunlight is far brighter than the
				// sky, so the sun stays the dominant source and cast shadows read clearly
				// against the soft sky fill. the longer air path near the horizon dims and
				// warms it ( the fill dims with it, as the environment is re-baked below ).

				const sinElevation = Math.sin( THREE.MathUtils.degToRad( elevation ) );
				const transmittance = Math.sqrt( Math.max( sinElevation, 0 ) ); // 0 at the horizon → 1 at the zenith
				sunLight.color.copy( sunHorizonColor ).lerp( sunMiddayColor, transmittance );
				sunLight.intensity = 6 * transmittance; // illuminance perpendicular to the rays; the renderer applies N·L per surface
				sunLight.position.copy( sun ).multiplyScalar( 800 );

				// re-bake the sky ( without the sun disc ) into the environment map for IBL

				sky.showSunDisc.value = false;
				envScene.add( sky );
				const env = pmremGenerator.fromScene( envScene ).texture;
				if ( scene.environment ) scene.environment.dispose();
				scene.environment = env;
				sky.showSunDisc.value = true;
				scene.add( sky );

			}

			function generateVillage() {

				if ( villageGroup ) scene.remove( villageGroup );

				village.parameters.seed = parameters.seed;
				villageGroup = village.build( materials );
				scene.add( villageGroup );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				controls.update();

				renderPipeline.render();

			}

		</script>

	</body>
</html>
