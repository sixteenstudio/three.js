<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - village generator</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - village generator">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_generator_village.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_generator_village.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Village Generator</span>
			</div>

			<small>
				A procedurally generated Ligurian cliffside village, in the manner of the Cinque Terre.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { SkyMesh } from 'three/addons/objects/SkyMesh.js';
			import { VillageGenerator } from 'three/addons/generators/VillageGenerator.js';
			import { createHouseMaterial } from 'three/addons/generators/village/HouseGenerator.js';

			let camera, scene, renderer, controls;
			let villageGroup, materials, village;
			let sky, sunLight, pmremGenerator, envScene;

			// reused by updateSun(): the current sun direction and the key-light
			// colours it blends between as the sun nears the horizon or climbs high
			const sun = new THREE.Vector3();
			const sunHorizonColor = new THREE.Color( 0xffb072 );
			const sunMiddayColor = new THREE.Color( 0xfff4e8 );

			const parameters = {
				seed: 1,
				timeOfDay: 10.5 // hours: 6 sunrise, 12 noon, 18 sunset
			};

			init();

			async function init() {

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 0.55;
				renderer.shadowMap.enabled = true;
				renderer.shadowMap.type = THREE.PCFSoftShadowMap;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				pmremGenerator = new THREE.PMREMGenerator( renderer );

				scene = new THREE.Scene();
				scene.environmentIntensity = 0.35; // sky as a soft fill; the sun is the key

				// a physical sky drives both the backdrop and the image-based lighting;
				// low turbidity for the deep Mediterranean blue

				sky = new SkyMesh();
				sky.scale.setScalar( 10000 );
				sky.turbidity.value = 3;
				sky.rayleigh.value = 2.5;
				sky.mieCoefficient.value = 0.004;
				sky.mieDirectionalG.value = 0.9;

				envScene = new THREE.Scene();

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 1, 8000 );
				camera.position.set( 150, 62, 235 );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableDamping = true;
				controls.target.set( - 30, 22, 15 );
				controls.maxPolarAngle = Math.PI * 0.49;
				controls.minDistance = 40;
				controls.maxDistance = 900;
				controls.update();

				// a single directional key aligned with the sky's sun, for the crisp
				// shadows the IBL alone can't give; sized to hold the whole headland

				sunLight = new THREE.DirectionalLight();
				sunLight.castShadow = true;
				sunLight.shadow.camera.left = - 300;
				sunLight.shadow.camera.right = 300;
				sunLight.shadow.camera.top = 320;
				sunLight.shadow.camera.bottom = - 200;
				sunLight.shadow.camera.far = 2000;
				sunLight.shadow.mapSize.set( 4096, 4096 );
				sunLight.shadow.bias = - 0.0004;
				scene.add( sunLight );

				updateSun();

				materials = { house: createHouseMaterial() };
				village = new VillageGenerator( { seed: parameters.seed } );
				generateVillage();

				// parameters

				const gui = renderer.inspector.createParameters( 'Village' );
				gui.add( parameters, 'seed', 0, 100, 1 ).onChange( generateVillage );
				gui.add( parameters, 'timeOfDay', 6, 18, 0.1 ).name( 'time of day' ).onChange( updateSun );
				gui.add( renderer, 'toneMappingExposure', 0.01, 1 ).name( 'exposure' );

				window.addEventListener( 'resize', onWindowResize );

			}

			function updateSun() {

				// map the time of day to a sun arc: low and warm at dawn / dusk, high
				// and bright at noon, sweeping east → west over the sea

				const t = parameters.timeOfDay;
				const u = ( t - 12 ) / 6; // -1 at sunrise, 0 at noon, +1 at sunset
				const elevation = Math.max( 0, 1 - u * u ) * 68; // degrees above the horizon, peaks at noon
				const azimuth = 135 + u * 80; // east of the cove → west behind the headland

				sun.setFromSphericalCoords( 1, THREE.MathUtils.degToRad( 90 - elevation ), THREE.MathUtils.degToRad( azimuth ) );
				sky.sunPosition.value.copy( sun );

				// physically-motivated key light: real sunlight is far brighter than the
				// sky, so the sun stays the dominant source and cast shadows read clearly
				// against the soft sky fill. the longer air path near the horizon dims and
				// warms it ( the fill dims with it, as the environment is re-baked below ).

				const sinElevation = Math.sin( THREE.MathUtils.degToRad( elevation ) );
				const transmittance = Math.sqrt( Math.max( sinElevation, 0 ) ); // 0 at the horizon → 1 at the zenith
				sunLight.color.copy( sunHorizonColor ).lerp( sunMiddayColor, transmittance );
				sunLight.intensity = 6 * transmittance; // illuminance perpendicular to the rays; the renderer applies N·L per surface
				sunLight.position.copy( sun ).multiplyScalar( 800 );

				// re-bake the sky ( without the sun disc ) into the environment map for IBL

				sky.showSunDisc.value = false;
				envScene.add( sky );
				const env = pmremGenerator.fromScene( envScene ).texture;
				if ( scene.environment ) scene.environment.dispose();
				scene.environment = env;
				sky.showSunDisc.value = true;
				scene.add( sky );

			}

			function generateVillage() {

				if ( villageGroup ) scene.remove( villageGroup );

				village.parameters.seed = parameters.seed;
				villageGroup = village.build( materials );
				scene.add( villageGroup );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				controls.update();

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
