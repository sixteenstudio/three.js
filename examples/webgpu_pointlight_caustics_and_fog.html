<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - point light caustics and fog</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - point light caustics and fog">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_pointlight_caustics_and_fog.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_pointlight_caustics_and_fog.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Point Light Caustics + Fog</span>
			</div>

			<small>HDR caustic refracted shadows from a glass model lit by three volumetric point lights, with optional volumetric fog.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { PointLightNode } from 'three/webgpu';
			import { Fn, uniform, texture, triplanarTexture, pass, screenUV, vec4 } from 'three/tsl';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			import { caustic } from 'three/addons/tsl/shadows/CausticNode.js';
			import { VolumetricPointLight } from 'three/addons/lights/VolumetricPointLight.js';
			import { bloom } from 'three/addons/tsl/display/BloomNode.js';

			const FOG_LAYER = 10;

			let camera, scene, renderer, controls, renderPipeline;
			let model;

			const lights = [];
			const marbles = [];

			const params = {
				rotationSpeed: 0.3,
				lightIntensity: 700,
				shadowIntensity: 0.95,
				fog: false,
				drop: true,
				spawnRate: 0.45
			};

			const causticScale = uniform( 0.6 );
			const causticOcclusion = uniform( 12 );
			const causticDispersion = uniform( 0.004 );
			const causticIntensity = uniform( 25 );
			const checkerScale = uniform( 1 );
			const fogDensity = uniform( 1 );
			const fogIntensity = uniform( 0.6 );

			let causticMap, marbleGeometry, marbleMaterial;
			let spawnTimer = 0, lastTime = 0;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.5, 100 );
				camera.position.set( 0, 9, 14 );

				scene = new THREE.Scene();
				scene.add( new THREE.AmbientLight( 0x223344, 0.4 ) );

				// textures

				const textureLoader = new THREE.TextureLoader();

				causticMap = textureLoader.load( 'textures/opengameart/Caustic_Free.jpg' );
				causticMap.wrapS = causticMap.wrapT = THREE.RepeatWrapping;
				causticMap.colorSpace = THREE.SRGBColorSpace;

				const tileMap = makeTileTexture();
				tileMap.repeat.set( 10, 10 );

				const checkerMap = makeCheckerTexture();

				// room

				const room = new THREE.Mesh(
					new THREE.BoxGeometry( 30, 16, 30 ),
					new THREE.MeshStandardMaterial( { map: tileMap, side: THREE.BackSide, roughness: 0.9 } )
				);
				room.position.y = 8;
				room.receiveShadow = true;
				scene.add( room );

				// glass model with a checkerboard caustic refracted shadow.
				// The checker is projected triplanarly so it wraps the ( UV-less ) model smoothly.

				const checkerNode = triplanarTexture( texture( checkerMap ), null, null, checkerScale );

				const glassMaterial = new THREE.MeshPhysicalNodeMaterial( {
					transmission: 1,
					ior: 1.5,
					roughness: 0.05,
					metalness: 0,
					thickness: 1.5,
					transparent: true
				} );
				glassMaterial.colorNode = checkerNode;
				glassMaterial.castShadowNode = Fn( () => {

					const checker = checkerNode.r; // 1 = clear glass, 0.3 = dark square

					return vec4( caustic( texture( causticMap ), 1.5, causticOcclusion, causticScale, causticDispersion, causticIntensity ).mul( checker ), 0.9 );

				} )();

				model = new THREE.Group();
				scene.add( model );

				const gltf = await new GLTFLoader().loadAsync( 'models/gltf/InterestingHuman.glb' );
				const object = gltf.scene;

				// fit: scale to ~5 units tall and rest the base on the floor
				const box = new THREE.Box3().setFromObject( object );
				const size = box.getSize( new THREE.Vector3() );
				object.scale.setScalar( 5 / size.y );

				box.setFromObject( object );
				const center = box.getCenter( new THREE.Vector3() );
				object.position.set( - center.x, - box.min.y, - center.z );

				object.traverse( child => {

					if ( child.isMesh ) {

						child.material = glassMaterial;
						child.castShadow = true;

					}

				} );

				model.add( object );

				// three shadow-casting volumetric point lights ( HDR caustic refracted shadows )

				const colors = [ 0x00ffcc, 0x66ff00, 0xff7a00 ];

				for ( let i = 0; i < 3; i ++ ) {

					const angle = ( i / 3 ) * Math.PI * 2 + Math.PI / 2;

					const light = new VolumetricPointLight( colors[ i ], params.lightIntensity, 0, 2 );
					light.position.set( Math.cos( angle ) * 9, 10, Math.sin( angle ) * 9 );
					light.castShadow = true;
					light.shadow.mapSize.set( 1024, 1024 );
					light.shadow.camera.near = 1;
					light.shadow.camera.far = 40;
					light.shadow.bias = - 0.003;
					light.shadow.intensity = params.shadowIntensity;
					light.layers.enable( FOG_LAYER ); // light scatters into the volumetric fog
					scene.add( light );

					lights.push( light );

				}

				// shared glass marbles ( single glass texture, demo-style refraction )

				marbleGeometry = new THREE.SphereGeometry( 0.35, 32, 16 );

				marbleMaterial = new THREE.MeshPhysicalNodeMaterial( {
					transmission: 1,
					ior: 1.5,
					roughness: 0.05,
					metalness: 0,
					thickness: 0.5,
					transparent: true
				} );
				marbleMaterial.castShadowNode = vec4( caustic( texture( causticMap ), 1.5, causticOcclusion, causticScale, causticDispersion, causticIntensity ), 0.85 );

				// renderer

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.library.addLight( PointLightNode, VolumetricPointLight ); // resolve the custom light
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.AgXToneMapping;
				renderer.toneMappingExposure = 1.1;
				renderer.shadowMap.enabled = true;
				renderer.shadowMap.transmitted = true; // enables caustic refracted shadows
				document.body.appendChild( renderer.domElement );

				// volumetric fog: a fog volume on its own layer, lit ( and caustic-shadowed ) by the point lights

				const fogMaterial = new THREE.VolumeNodeMaterial();
				fogMaterial.steps = 12; // uniform density; fog amount is controlled by the composite intensity

				const fog = new THREE.Mesh( new THREE.BoxGeometry( 28, 15, 28 ), fogMaterial );
				fog.position.y = 7.5;
				fog.receiveShadow = true;
				fog.layers.disableAll();
				fog.layers.enable( FOG_LAYER );
				scene.add( fog );

				const fogLayer = new THREE.Layers();
				fogLayer.disableAll();
				fogLayer.enable( FOG_LAYER );

				renderPipeline = new THREE.RenderPipeline( renderer );

				const scenePass = pass( scene, camera );
				fogMaterial.depthNode = scenePass.getTextureNode( 'depth' ).sample( screenUV );

				const fogPass = pass( scene, camera, { depthBuffer: false, samples: 0 } ).setLayers( fogLayer );
				fogPass.setResolutionScale( 0.5 );

				renderPipeline.outputNode = scenePass.add( bloom( fogPass, 1, 1, 0 ).mul( fogIntensity ) );

				// controls

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 2.5, 0 );
				controls.maxDistance = 24;
				controls.maxPolarAngle = Math.PI / 2;
				controls.update();

				// gui

				const gui = new GUI();

				const caustics = gui.addFolder( 'Caustics' );
				caustics.add( causticIntensity, 'value', 0, 60, 1 ).name( 'intensity' );
				caustics.add( causticScale, 'value', 0.1, 1.5, 0.01 ).name( 'scale' );
				caustics.add( causticOcclusion, 'value', 1, 40, 1 ).name( 'occlusion' );
				caustics.add( causticDispersion, 'value', 0, 0.02, 0.001 ).name( 'dispersion' );
				caustics.add( checkerScale, 'value', 0.1, 5, 0.05 ).name( 'checker scale' );
				caustics.add( params, 'shadowIntensity', 0, 1, 0.01 ).name( 'shadow' ).onChange( v => lights.forEach( l => l.shadow.intensity = v ) );

				const lighting = gui.addFolder( 'Lights' );
				lighting.add( params, 'lightIntensity', 0, 2000, 10 ).name( 'intensity' ).onChange( v => lights.forEach( l => l.intensity = v ) );

				const volumetric = gui.addFolder( 'Volumetric fog' );
				volumetric.add( params, 'fog' ).name( 'enabled' );
				volumetric.add( fogDensity, 'value', 0, 4, 0.05 ).name( 'density' );
				volumetric.add( fogIntensity, 'value', 0, 2, 0.05 ).name( 'intensity' );

				const animation = gui.addFolder( 'Animation' );
				animation.add( params, 'rotationSpeed', 0, 2, 0.01 ).name( 'rotation' );
				animation.add( params, 'drop' ).name( 'drop marbles' );
				animation.add( params, 'spawnRate', 0.1, 2, 0.05 ).name( 'spawn rate' );

				window.addEventListener( 'resize', onWindowResize );

			}

			function makeTileTexture() {

				const canvas = document.createElement( 'canvas' );
				canvas.width = canvas.height = 128;

				const ctx = canvas.getContext( '2d' );
				ctx.fillStyle = '#cdd2d6';
				ctx.fillRect( 0, 0, 128, 128 );
				ctx.strokeStyle = '#6a7176';
				ctx.lineWidth = 6;
				ctx.strokeRect( 0, 0, 128, 128 );

				const tex = new THREE.CanvasTexture( canvas );
				tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
				tex.colorSpace = THREE.SRGBColorSpace;
				return tex;

			}

			function makeCheckerTexture() {

				const size = 8;

				const canvas = document.createElement( 'canvas' );
				canvas.width = canvas.height = size;

				const ctx = canvas.getContext( '2d' );

				for ( let y = 0; y < size; y ++ ) {

					for ( let x = 0; x < size; x ++ ) {

						ctx.fillStyle = ( x + y ) % 2 ? '#4d4d4d' : '#ffffff';
						ctx.fillRect( x, y, 1, 1 );

					}

				}

				const tex = new THREE.CanvasTexture( canvas );
				tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
				tex.magFilter = THREE.NearestFilter;
				tex.minFilter = THREE.NearestFilter;
				return tex;

			}

			function spawnMarble() {

				let x, z;

				for ( let attempt = 0; attempt < 12; attempt ++ ) {

					x = ( Math.random() - 0.5 ) * 18;
					z = ( Math.random() - 0.5 ) * 18;

					if ( Math.hypot( x, z ) < 3.2 ) continue; // keep clear of the model
					if ( marbles.some( m => Math.hypot( m.x - x, m.z - z ) < 1.5 ) ) continue;

					const mesh = new THREE.Mesh( marbleGeometry, marbleMaterial );
					mesh.castShadow = true;
					scene.add( mesh );

					marbles.push( { mesh, x, z, age: 0, life: 3, freq: 4 + Math.random() * 2 } );
					return;

				}

			}

			function updateMarbles( dt ) {

				if ( params.drop ) {

					spawnTimer += dt;

					if ( spawnTimer > params.spawnRate ) {

						spawnTimer = 0;
						spawnMarble();

					}

				}

				for ( let i = marbles.length - 1; i >= 0; i -- ) {

					const m = marbles[ i ];
					m.age += dt;

					if ( m.age > m.life ) {

						scene.remove( m.mesh );
						marbles.splice( i, 1 );
						continue;

					}

					const scale = THREE.MathUtils.smoothstep( m.age, 0, 0.25 ) * ( 1 - THREE.MathUtils.smoothstep( m.age, m.life - 0.7, m.life ) );
					const bounce = Math.abs( Math.cos( m.age * m.freq ) ) * 3 * ( 1 - m.age / m.life );

					m.mesh.scale.setScalar( scale );
					m.mesh.position.set( m.x, 0.35 * scale + bounce, m.z );

				}

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate( time ) {

				const dt = lastTime ? ( time - lastTime ) / 1000 : 0;
				lastTime = time;

				if ( model ) model.rotation.y += params.rotationSpeed * dt;

				if ( marbleMaterial ) updateMarbles( dt );
				controls.update();

				if ( params.fog ) renderPipeline.render();
				else renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
