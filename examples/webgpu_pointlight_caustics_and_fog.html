<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - point light caustics and fog</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - point light caustics and fog">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_pointlight_caustics_and_fog.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_pointlight_caustics_and_fog.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Point Light Caustics + Fog</span>
			</div>

			<small>HDR caustic refracted shadows from a glass model lit by three volumetric point lights, with optional volumetric fog.</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { PointLightNode } from 'three/webgpu';
			import { Fn, uniform, texture, triplanarTexture, pass, screenUV, vec4, uv, positionLocal, normalLocal } from 'three/tsl';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			import { caustic } from 'three/addons/tsl/shadows/CausticNode.js';
			import { VolumetricPointLight } from 'three/addons/lights/VolumetricPointLight.js';
			import { bloom } from 'three/addons/tsl/display/BloomNode.js';

			const FOG_LAYER = 10;
			const LIGHT_RADIUS = 10;
			const TILE_REPEAT = 3; // Tiles21 texture is a 4x4 tile grid; 3 repeats -> 12 tiles per 30-unit face

			let camera, scene, renderer, controls, renderPipeline;
			let model;

			const lights = [];
			const marbles = [];

			const params = {
				rotationSpeed: 0.16,
				lightIntensity: 40,
				lightOrbitSpeed: 0.38,
				lightHeight: 16,
				shadowIntensity: 1,
				shadowMapSize: 4096,
				fog: true,
				drop: true,
				spawnRate: 1.4
			};

			let lightOrbit = 0;

			const causticScale = uniform( 0.6 );
			const causticOcclusion = uniform( 12 );
			const causticDispersion = uniform( 0.004 );
			const causticIntensity = uniform( 30 );
			const checkerScale = uniform( 3.75 );
			const fogDensity = uniform( 0.05 );
			const fogIntensity = uniform( 1.05 );

			let causticMap, marbleGeometry, marbleMaterial;
			let spawnTimer = 0, lastTime = 0;

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.5, 100 );
				camera.position.set( 0, 15, 30 );

				scene = new THREE.Scene();
				scene.add( new THREE.AmbientLight( 0x223344, 0.4 ) );

				// textures

				const textureLoader = new THREE.TextureLoader();

				causticMap = textureLoader.load( 'textures/opengameart/Caustic_Free.jpg' );
				causticMap.wrapS = causticMap.wrapT = THREE.RepeatWrapping;
				causticMap.colorSpace = THREE.SRGBColorSpace;

				const checkerMap = makeCheckerTexture();

				// Tiles21 PBR set ( textures.com style: COL / NRM / GLOSS / DISP / REFL ). Loaded once and
				// shared across all six room faces so floor, ceiling and walls carry the same ceramic tiles.

				const loadTile = ( file, srgb ) => {

					const tex = textureLoader.load( 'textures/Tiles21/' + file );
					tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
					tex.repeat.set( TILE_REPEAT, TILE_REPEAT );
					if ( srgb ) tex.colorSpace = THREE.SRGBColorSpace;
					return tex;

				};

				const tileColor = loadTile( 'Tiles21_COL_VAR1_2K.jpg', true );  // albedo
				const tileNormal = loadTile( 'Tiles21_NRM_2K.jpg', false );     // tangent-space normals
				const tileGloss = loadTile( 'Tiles21_GLOSS_2K.jpg', false );    // glossiness ( inverted -> roughness )
				const tileDisp = loadTile( 'Tiles21_DISP_2K.jpg', false );      // height -> vertex displacement
				const tileRefl = loadTile( 'Tiles21_REFL_2K.jpg', false );      // reflectivity -> subtle metalness

				// room

				// every map is sampled with the same tiled uv. GLOSS is inverted into roughness, REFL drives a
				// faint metalness, and DISP is pushed into the vertex position node ( node materials don't apply
				// displacementMap automatically ), so the whole Tiles21 set contributes.
				const tileUV = uv().mul( TILE_REPEAT );

				const roomMaterial = new THREE.MeshStandardNodeMaterial( {
					map: tileColor,
					normalMap: tileNormal,
					side: THREE.BackSide
				} );
				// GLOSS -> roughness, but remapped to a semi-gloss ceramic range ( ~0.4 - 0.9 ) so the tiles
				// don't behave like mirrors and blow out under the three intense coloured lights.
				roomMaterial.roughnessNode = texture( tileGloss, tileUV ).r.oneMinus().mul( 0.5 ).add( 0.4 );
				roomMaterial.metalnessNode = texture( tileRefl, tileUV ).r.mul( 0.06 );
				roomMaterial.positionNode = positionLocal.add( normalLocal.mul( texture( tileDisp, tileUV ).r.sub( 0.5 ).mul( 0.25 ) ) );

				// segmented cube so the displacement has vertices to move; square tiles on all faces
				const room = new THREE.Mesh( new THREE.BoxGeometry( 30, 30, 30, 48, 48, 48 ), roomMaterial );
				room.position.y = 15;
				room.receiveShadow = true;
				scene.add( room );

				// glass model with a checkerboard caustic refracted shadow.
				// The checker is projected triplanarly so it wraps the ( UV-less ) model smoothly.

				const checkerNode = triplanarTexture( texture( checkerMap ), null, null, checkerScale );

				const glassMaterial = new THREE.MeshPhysicalNodeMaterial( {
					transmission: 1,
					ior: 1.5,
					roughness: 0.05,
					metalness: 0,
					thickness: 1.5,
					transparent: true
				} );
				glassMaterial.colorNode = checkerNode;
				glassMaterial.castShadowNode = Fn( () => {

					const checker = checkerNode.r; // 1 = clear glass, 0.3 = dark square

					return vec4( caustic( texture( causticMap ), 1.5, causticOcclusion, causticScale, causticDispersion, causticIntensity ).mul( checker ), 0.9 );

				} )();

				model = new THREE.Group();
				scene.add( model );

				const gltf = await new GLTFLoader().loadAsync( 'models/gltf/InterestingHuman.glb' );
				const object = gltf.scene;

				// fit: scale to ~15 units tall and rest the base on the floor
				const box = new THREE.Box3().setFromObject( object );
				const size = box.getSize( new THREE.Vector3() );
				object.scale.setScalar( 15 / size.y );

				box.setFromObject( object );
				const center = box.getCenter( new THREE.Vector3() );
				object.position.set( - center.x, - box.min.y, - center.z );

				object.traverse( child => {

					if ( child.isMesh ) {

						child.material = glassMaterial;
						child.castShadow = true;

					}

				} );

				model.add( object );

				// three shadow-casting volumetric point lights ( HDR caustic refracted shadows )

				const colors = [ 0x00ffcc, 0x66ff00, 0xff7a00 ];

				for ( let i = 0; i < 3; i ++ ) {

					const angle = ( i / 3 ) * Math.PI * 2 + Math.PI / 2;

					const light = new VolumetricPointLight( colors[ i ], params.lightIntensity, 0, 2 );
					light.position.set( Math.cos( angle ) * LIGHT_RADIUS, params.lightHeight, Math.sin( angle ) * LIGHT_RADIUS );
					light.castShadow = true;
					light.shadow.mapSize.setScalar( params.shadowMapSize );
					light.shadow.camera.near = 1;
					light.shadow.camera.far = 60;
					light.shadow.bias = - 0.003;
					light.shadow.intensity = params.shadowIntensity;
					light.layers.enable( FOG_LAYER ); // light scatters into the volumetric fog
					light.userData.baseAngle = angle;

					// a glowing bulb at the light, tinted a lighter shade of the light's colour
					const bulbColor = new THREE.Color( colors[ i ] ).lerp( new THREE.Color( 0xffffff ), 0.4 );
					const bulb = new THREE.Mesh( new THREE.SphereGeometry( 0.4, 24, 16 ), new THREE.MeshBasicMaterial( { color: bulbColor } ) );
					light.add( bulb );

					scene.add( light );

					lights.push( light );

				}

				// shared glass marbles ( single glass texture, demo-style refraction )

				marbleGeometry = new THREE.SphereGeometry( 0.35, 32, 16 );

				marbleMaterial = new THREE.MeshPhysicalNodeMaterial( {
					transmission: 1,
					ior: 1.5,
					roughness: 0.05,
					metalness: 0,
					thickness: 0.5,
					transparent: true
				} );
				marbleMaterial.castShadowNode = vec4( caustic( texture( causticMap ), 1.5, causticOcclusion, causticScale, causticDispersion, causticIntensity ), 0.85 );

				// renderer

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.library.addLight( PointLightNode, VolumetricPointLight ); // resolve the custom light
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1.3;
				renderer.shadowMap.enabled = true;
				renderer.shadowMap.transmitted = true; // enables caustic refracted shadows
				document.body.appendChild( renderer.domElement );

				// volumetric fog: a fog volume on its own layer, lit ( and caustic-shadowed ) by the point lights

				const fogMaterial = new THREE.VolumeNodeMaterial();
				fogMaterial.steps = 12;
				fogMaterial.scatteringNode = Fn( () => fogDensity ); // uniform density across the volume

				const fog = new THREE.Mesh( new THREE.BoxGeometry( 28, 28, 28 ), fogMaterial );
				fog.position.y = 14;
				fog.receiveShadow = true;
				fog.layers.disableAll();
				fog.layers.enable( FOG_LAYER );
				scene.add( fog );

				const fogLayer = new THREE.Layers();
				fogLayer.disableAll();
				fogLayer.enable( FOG_LAYER );

				renderPipeline = new THREE.RenderPipeline( renderer );

				const scenePass = pass( scene, camera );
				fogMaterial.depthNode = scenePass.getTextureNode( 'depth' ).sample( screenUV );

				const fogPass = pass( scene, camera, { depthBuffer: false, samples: 0 } ).setLayers( fogLayer );
				fogPass.setResolutionScale( 0.5 );

				// The fog pass is the colored point-light scattering modulated by each light's caustic shadow,
				// so the occluders carve volumetric shafts ( "god rays" ) into it. Feed it through bloom only:
				// the blur keeps the shafts soft. Adding the raw pass directly drew a sharp mid-air projection
				// of the model between each light and the mesh, which is why that was removed.
				renderPipeline.outputNode = scenePass.add( bloom( fogPass, 1, 1, 0 ).mul( fogIntensity ) );

				// controls

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 9, 0 );
				controls.maxDistance = 44;
				controls.maxPolarAngle = Math.PI / 2;
				controls.update();

				// gui

				const gui = new GUI();

				const caustics = gui.addFolder( 'Caustics' );
				caustics.add( causticIntensity, 'value', 0, 60, 1 ).name( 'intensity' );
				caustics.add( causticScale, 'value', 0.1, 1.5, 0.01 ).name( 'scale' );
				caustics.add( causticOcclusion, 'value', 1, 40, 1 ).name( 'occlusion' );
				caustics.add( causticDispersion, 'value', 0, 0.02, 0.001 ).name( 'dispersion' );
				caustics.add( checkerScale, 'value', 0.1, 5, 0.05 ).name( 'checker scale' );
				caustics.add( params, 'shadowIntensity', 0, 1, 0.01 ).name( 'shadow' ).onChange( v => lights.forEach( l => l.shadow.intensity = v ) );

				const lighting = gui.addFolder( 'Lights' );
				lighting.add( params, 'lightIntensity', 0, 2000, 10 ).name( 'intensity' ).onChange( v => lights.forEach( l => l.intensity = v ) );
				lighting.add( params, 'lightOrbitSpeed', - 2, 2, 0.01 ).name( 'orbit speed' );
				lighting.add( params, 'lightHeight', 3, 29, 0.5 ).name( 'height' );
				lighting.add( params, 'shadowMapSize', { '1024': 1024, '2048': 2048, '4096': 4096 } ).name( 'shadow map size' )
					.onChange( v => lights.forEach( l => { l.shadow.mapSize.setScalar( v ); l.shadow.needsUpdate = true; } ) );
				lights.forEach( ( l, i ) => lighting.add( l, 'visible' ).name( 'light ' + ( i + 1 ) ) );

				const volumetric = gui.addFolder( 'Volumetric fog' );
				volumetric.add( params, 'fog' ).name( 'enabled' );
				volumetric.add( fogDensity, 'value', 0, 4, 0.05 ).name( 'density' );
				volumetric.add( fogIntensity, 'value', 0, 2, 0.05 ).name( 'intensity' );

				const animation = gui.addFolder( 'Animation' );
				animation.add( params, 'rotationSpeed', 0, 2, 0.01 ).name( 'rotation' );
				animation.add( params, 'drop' ).name( 'drop marbles' );
				animation.add( params, 'spawnRate', 0.1, 2, 0.05 ).name( 'spawn rate' );

				window.addEventListener( 'resize', onWindowResize );

			}

			function makeCheckerTexture() {

				const size = 8;

				const canvas = document.createElement( 'canvas' );
				canvas.width = canvas.height = size;

				const ctx = canvas.getContext( '2d' );

				for ( let y = 0; y < size; y ++ ) {

					for ( let x = 0; x < size; x ++ ) {

						ctx.fillStyle = ( x + y ) % 2 ? '#4d4d4d' : '#ffffff';
						ctx.fillRect( x, y, 1, 1 );

					}

				}

				const tex = new THREE.CanvasTexture( canvas );
				tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
				tex.magFilter = THREE.NearestFilter;
				tex.minFilter = THREE.NearestFilter;
				return tex;

			}

			function spawnMarble() {

				let x, z;

				for ( let attempt = 0; attempt < 12; attempt ++ ) {

					x = ( Math.random() - 0.5 ) * 22;
					z = ( Math.random() - 0.5 ) * 22;

					if ( Math.hypot( x, z ) < 5 ) continue; // keep clear of the model
					if ( marbles.some( m => Math.hypot( m.x - x, m.z - z ) < 1.5 ) ) continue;

					const mesh = new THREE.Mesh( marbleGeometry, marbleMaterial );
					mesh.castShadow = true;
					scene.add( mesh );

					marbles.push( { mesh, x, z, age: 0, life: 3, freq: 4 + Math.random() * 2 } );
					return;

				}

			}

			function updateMarbles( dt ) {

				if ( params.drop ) {

					spawnTimer += dt;

					if ( spawnTimer > params.spawnRate ) {

						spawnTimer = 0;
						spawnMarble();

					}

				}

				for ( let i = marbles.length - 1; i >= 0; i -- ) {

					const m = marbles[ i ];
					m.age += dt;

					if ( m.age > m.life ) {

						scene.remove( m.mesh );
						marbles.splice( i, 1 );
						continue;

					}

					const scale = THREE.MathUtils.smoothstep( m.age, 0, 0.25 ) * ( 1 - THREE.MathUtils.smoothstep( m.age, m.life - 0.7, m.life ) );
					const bounce = Math.abs( Math.cos( m.age * m.freq ) ) * 3 * ( 1 - m.age / m.life );

					m.mesh.scale.setScalar( scale );
					m.mesh.position.set( m.x, 0.35 * scale + bounce, m.z );

				}

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate( time ) {

				const dt = lastTime ? ( time - lastTime ) / 1000 : 0;
				lastTime = time;

				if ( model ) model.rotation.y += params.rotationSpeed * dt;

				// orbit the lights ( and their bulbs ) around the shared circle, following each other
				lightOrbit += params.lightOrbitSpeed * dt;

				for ( const light of lights ) {

					const a = light.userData.baseAngle + lightOrbit;
					light.position.set( Math.cos( a ) * LIGHT_RADIUS, params.lightHeight, Math.sin( a ) * LIGHT_RADIUS );

				}

				if ( marbleMaterial ) updateMarbles( dt );
				controls.update();

				if ( params.fog ) renderPipeline.render();
				else renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
